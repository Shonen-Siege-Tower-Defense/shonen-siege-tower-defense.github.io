name: Validate Summoning feature branch

on:
  push:
    branches:
      - feature/summon-banner-admin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build game
        run: npm run build
      - name: Save preview build
        uses: actions/upload-artifact@v4
        with:
          name: shonen-siege-summoning-preview
          path: dist/
          retention-days: 7
